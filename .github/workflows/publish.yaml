name: Publish

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Release a version or align the tags on the current stable version"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - sync-tags
      bump:
        description: "Stable version bump type"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The whole npm test chain, the reused quality workflow's jobs. They run first and hold no write token. The
  # publish job below starts only when they pass, so the release token it mints is fresh when it pushes.
  quality:
    if: github.repository == 'bmad-code-org/bmad-method-test-architecture-enterprise' && github.ref == 'refs/heads/main' && inputs.operation == 'release'
    uses: ./.github/workflows/quality.yaml
    permissions:
      contents: read

  publish:
    needs: quality
    if: github.repository == 'bmad-code-org/bmad-method-test-architecture-enterprise' && github.ref == 'refs/heads/main' && inputs.operation == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      # Minted here, in the job that pushes, after the quality job's tests have finished: an installation token expires
      # after an hour, and the chain can run longer than that. Checkout persists this token for the push below.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure trusted publishing toolchain
        run: |
          # npm trusted publishing requires modern npm on the runner; the version floats so npm ci reads the lockfile the repo's own npm wrote.
          npm install --global npm@latest

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Align existing npm tags and confirm permission
        run: TEA_TAG_SYNC_ATTEMPTS=1 bash tools/sync-npm-tags.sh "$(node -p 'require("./package.json").name')"

      - name: Bump stable version
        run: npm version "${{ inputs.bump }}" --no-git-tag-version

      - name: Stamp CHANGELOG release section
        run: node tools/stamp-changelog.js

      - name: Sync marketplace and bmod versions
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          // The module record carries the version `bmad setup` compares against, as the `version` line of its [bmod] table.
          const bmodPath = 'skills/bmod-tea/bmod.toml';
          const bmodSource = fs.readFileSync(bmodPath, 'utf8');
          const bmodVersionLine = /^version = "[^"]*"$/m;
          if (!bmodVersionLine.test(bmodSource)) {
            throw new Error(`${bmodPath} has no version line`);
          }
          fs.writeFileSync(bmodPath, bmodSource.replace(bmodVersionLine, `version = "${packageJson.version}"`));

          const marketplacePath = '.claude-plugin/marketplace.json';
          const marketplace = JSON.parse(fs.readFileSync(marketplacePath, 'utf8'));
          const plugin = (marketplace.plugins || []).find((entry) => entry && entry.name === packageJson.name);

          if (!plugin) {
            throw new Error(`Marketplace entry not found for ${packageJson.name}`);
          }

          plugin.version = packageJson.version;
          fs.writeFileSync(marketplacePath, `${JSON.stringify(marketplace, null, 2)}\n`);
          NODE

      - name: Validate release metadata
        run: npm run test:release-metadata

      - name: Commit version bump
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          git add package.json package-lock.json .claude-plugin/marketplace.json skills/bmod-tea/bmod.toml CHANGELOG.md
          git commit -m "release: bump to v${VERSION} [skip ci]"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"

      - name: Push version commit and tag
        run: git push origin main --follow-tags

      - name: Publish stable release to npm
        run: npm publish --tag latest --provenance

      - name: Create GitHub Release
        run: |
          TAG="v$(node -p 'require("./package.json").version')"
          VERSION="${TAG#v}"
          has_release_notes() {
            awk '
              /^[[:space:]]*$/ { next }
              /^[[:space:]]*-{3,}[[:space:]]*$/ { next }
              { found = 1 }
              END { exit found ? 0 : 1 }
            ' <<< "$1"
          }
          # Each lookup prints the section's heading line first, then its body.
          SECTION=$(awk -v ver="$VERSION" '
            /^## / {
              if (found) exit
              if ($0 ~ ("^##[[:space:]]*\\[?[[:space:]]*v?" ver "[[:space:]]*\\]?([[:space:]]*-[[:space:]].*)?$")) { found=1; print }
              next
            }
            found { print }
          ' CHANGELOG.md)
          BODY=$(sed 1d <<< "$SECTION")
          if ! has_release_notes "$BODY"; then
            SECTION=$(awk '
              /^##[[:space:]]*\[Unreleased\]/ { found=1; print; next }
              /^## / {
                if (found) exit
                next
              }
              found { print }
            ' CHANGELOG.md)
            BODY=$(sed 1d <<< "$SECTION")
            if has_release_notes "$BODY"; then
              echo "::notice::No CHANGELOG.md entry for $TAG — using [Unreleased] notes"
            fi
          fi
          if ! has_release_notes "$BODY"; then
            echo "::warning::No CHANGELOG.md entry for $TAG — falling back to auto-generated notes"
            gh release create "$TAG" --generate-notes
          else
            # A GitHub Release body is capped at 125,000 characters; longer notes are cut at a bullet and link the full section.
            NOTES=$(node tools/release-notes.js --version "$VERSION" --tag "$TAG" --repo "$GITHUB_REPOSITORY" --heading "$(head -n1 <<< "$SECTION")" <<< "$BODY")
            gh release create "$TAG" --notes-file - <<< "$NOTES"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Point next at the stable release
        run: bash tools/sync-npm-tags.sh "$(node -p 'require("./package.json").name')" "$(node -p 'require("./package.json").version')"

  sync-tags:
    if: github.repository == 'bmad-code-org/bmad-method-test-architecture-enterprise' && github.ref == 'refs/heads/main' && inputs.operation == 'sync-tags'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
      - name: Ensure npm can manage dist-tags with OIDC
        run: npm install --global npm@latest
      - name: Align next with latest
        run: bash tools/sync-npm-tags.sh "$(node -p 'require("./package.json").name')"
